<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Luyện viết chữ Hán</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e; color: #eee;
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
    user-select: none; -webkit-user-select: none;
  }
  .header {
    padding: 10px 15px; display: flex;
    justify-content: space-between; align-items: center;
    background: #0f0f1e;
  }
  .header h1 { font-size: 16px; color: #4fc3f7; }
  .header .word { font-size: 18px; font-weight: bold; color: #fff; }
  .canvas-wrapper {
    flex: 1;
    position: relative; margin: 10px;
    background: #f8f8f8; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, #ddd 1px, transparent 1px),
      linear-gradient(to bottom, #ddd 1px, transparent 1px);
    background-size: 12.5% 12.5%;
    pointer-events: none;
  }
  .grid-bg::before, .grid-bg::after {
    content: ''; position: absolute; background: rgba(244,67,54,0.5);
  }
  .grid-bg::before { left: 50%; top: 0; width: 1px; height: 100%; }
  .grid-bg::after  { top: 50%; left: 0; width: 100%; height: 1px; }
  .ghost-word {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: min(50vw, 280px); color: #d0d0d0;
    font-family: "KaiTi", "STKaiti", "SimSun", serif;
    pointer-events: none; user-select: none;
    transition: opacity 0.2s;
  }
  canvas { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
  .controls {
    display: flex; gap: 8px; padding: 10px 15px 15px;
    background: #0f0f1e;
  }
  button {
    flex: 1; padding: 14px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; color: white;
    transition: transform 0.15s;
  }
  button:active { transform: scale(0.95); }
  .btn-clear { background: #ff7043; }
  .btn-toggle { background: #42a5f5; }
  .btn-undo  { background: #ab47bc; }
</style>
</head>
<body>
  <div class="header">
    <h1>✍️ Luyện viết</h1>
    <div class="word" id="wordDisplay">爱</div>
  </div>

  <div class="canvas-wrapper" id="wrapper">
    <div class="grid-bg"></div>
    <div class="ghost-word" id="ghost">爱</div>
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <button class="btn-undo" onclick="undo()">↩️ Hoàn tác</button>
    <button class="btn-clear" onclick="clearAll()">🗑️ Xoá hết</button>
    <button class="btn-toggle" onclick="toggleGhost()">👁️ Ẩn/Hiện</button>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const word = params.get('word') || '爱';

  document.getElementById('wordDisplay').textContent = word;
  document.getElementById('ghost').textContent = word;

  const canvas = document.getElementById('canvas');
  const wrapper = document.getElementById('wrapper');
  const ghost = document.getElementById('ghost');
  const ctx = canvas.getContext('2d');

  let drawing = false;
  let lastX = 0, lastY = 0;
  let strokes = [];      // history
  let currentStroke = [];

  function resize() {
    const rect = wrapper.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#1a1a2e';
    ctx.lineWidth = 10;
    redraw();
  }

  function redraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    strokes.forEach(stroke => {
      if (stroke.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(stroke[0].x, stroke[0].y);
      for (let i = 1; i < stroke.length; i++) {
        ctx.lineTo(stroke[i].x, stroke[i].y);
      }
      ctx.stroke();
    });
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function start(e) {
    e.preventDefault();
    drawing = true;
    currentStroke = [];
    const p = getPos(e);
    currentStroke.push(p);
    lastX = p.x; lastY = p.y;
  }

  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    currentStroke.push(p);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  }

  function end(e) {
    if (!drawing) return;
    e.preventDefault();
    drawing = false;
    if (currentStroke.length > 0) strokes.push(currentStroke);
    currentStroke = [];
  }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, {passive: false});
  canvas.addEventListener('touchmove', move, {passive: false});
  canvas.addEventListener('touchend', end, {passive: false});
  canvas.addEventListener('touchcancel', end, {passive: false});

  function clearAll() {
    strokes = [];
    redraw();
  }

  function undo() {
    strokes.pop();
    redraw();
  }

  let ghostVisible = true;
  function toggleGhost() {
    ghostVisible = !ghostVisible;
    ghost.style.opacity = ghostVisible ? '1' : '0';
  }

  window.addEventListener('resize', resize);
  resize();

  // Cập nhật khi URL đổi (VD: mở lại với word khác)
  window.addEventListener('popstate', () => {
    const w = new URLSearchParams(window.location.search).get('word') || '爱';
    document.getElementById('wordDisplay').textContent = w;
    document.getElementById('ghost').textContent = w;
  });
</script>
</body>
</html>
